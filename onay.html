<!DOCTYPE html><html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex"><title>Onay</title><style>
*{box-sizing:border-box;margin:0}html,body{height:100%;overflow:hidden}
body{background:#0f1115;color:#f2f2f2;font-family:-apple-system,system-ui,sans-serif;display:flex;flex-direction:column;justify-content:center;padding:24px 20px calc(24px + env(safe-area-inset-bottom))}
.k{font-size:14px;color:#8a93a3;letter-spacing:.04em;text-transform:uppercase;margin-bottom:8px}
h1{font-size:26px;line-height:1.2;margin-bottom:12px}p{font-size:18px;line-height:1.4;color:#cfd3da;white-space:pre-line}
#btn{margin-top:30px}.r{display:flex;gap:12px}
button{flex:1;border:0;border-radius:14px;font-weight:700;color:#fff;-webkit-tap-highlight-color:transparent}
.big{font-size:22px;padding:22px 0}#ok{background:#1f9d55}#no{background:#c0392b}button:active{opacity:.7}
.s{font-size:15px;color:#8a93a3;margin:24px 0 10px}.h button{background:#1d3b2c;color:#7fe0a8;font-size:17px;padding:16px 0;border:1px solid #2c6b49}
#son{display:none;text-align:center;margin-top:30px}#son .i{font-size:90px;line-height:1}#son .y{font-size:30px;font-weight:800;margin-top:12px}#son .a{font-size:17px;color:#8a93a3;margin-top:10px;line-height:1.4}
</style></head><body>
<div class="k">Onay isteği</div><h1 id="t"></h1><p id="b"></p>
<div id="btn"><div class="r"><button class="big" id="ok">Onayla</button><button class="big" id="no">Reddet</button></div>
<div class="s">Onayla ve şu süre boyunca hiç sorma:</div>
<div class="r h"><button data-h="1">1 saat</button><button data-h="2">2 saat</button><button data-h="4">4 saat</button><button data-h="8">8 saat</button></div></div>
<div id="son"><div class="i" id="si"></div><div class="y" id="sy"></div><div class="a" id="sa"></div></div>
<script>
// Bilgiler linkin # kısmında (sunucuya gitmez): base64url(JSON {s:seq, c:cevap konusu, t:başlık, b:metin})
// Süreli izin: cevap konusuna "IZIN <bitiş unix sn>" yazılır; o saate kadar Claude onay sormaz.
const $=i=>document.getElementById(i);
let D={};try{let h=location.hash.slice(1).replace(/-/g,'+').replace(/_/g,'/');D=JSON.parse(decodeURIComponent(escape(atob(h))))}catch(e){}
const C='https://ntfy.sh/'+(D.c||''),SEQ=D.s||'';
$('t').textContent=D.t||'Geçersiz link';$('b').textContent=D.b||'';
if(!D.c||!D.s){$('btn').style.display='none'}
const saat=u=>new Date(u*1000).toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'});
function goster(c,not){$('btn').style.display='none';$('son').style.display='block';
 if(c==='BEK'){$('si').textContent='⏳';$('sy').textContent='Gönderiliyor…';$('sa').textContent='';return}
 $('si').textContent=c==='OK'?'✅':'❌';$('sy').textContent=c==='OK'?'Onaylandı':'Reddedildi';$('sa').textContent=not||'Claude cevabını aldı. Bu sayfayı kapatabilirsin.'}
async function post(x){const r=await fetch(C,{method:'POST',body:x});if(!r.ok)throw 0}
async function gonder(c,h){goster('BEK');
 try{let not;if(h){const u=Math.floor(Date.now()/1000)+h*3600;await post('IZIN '+u);not='Saat '+saat(u)+'’e kadar hiçbir sohbet onay sormayacak. Sonra onay modu kendiliğinden açılır.'}
  await post(c+' '+SEQ);goster(c,not)}
 catch(e){$('son').style.display='none';$('btn').style.display='block';$('b').textContent='Gönderilemedi, tekrar bas.'}}
$('ok').onclick=()=>gonder('OK');$('no').onclick=()=>gonder('NO');
document.querySelectorAll('[data-h]').forEach(b=>b.onclick=()=>gonder('OK',+b.dataset.h));
if(D.c&&D.s)(async()=>{try{const x=await (await fetch(C+'/json?poll=1&since=48h')).text();
 for(const l of x.split('\n')){if(!l)continue;try{const j=JSON.parse(l);
  if(j.message==='OK '+SEQ)return goster('OK','Bu iş zaten onaylanmıştı.');
  if(j.message==='NO '+SEQ)return goster('NO','Bu iş zaten reddedilmişti.')}catch(e){}}}catch(e){}})();
</script></body></html>

<!DOCTYPE html><html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex"><title>Onay</title><style>
*{box-sizing:border-box;margin:0}html,body{height:100%;overflow:hidden}
body{background:#0f1115;color:#f2f2f2;font-family:-apple-system,system-ui,sans-serif;display:flex;flex-direction:column;justify-content:center;padding:28px 22px calc(28px + env(safe-area-inset-bottom))}
.k{font-size:15px;color:#8a93a3;letter-spacing:.04em;text-transform:uppercase;margin-bottom:10px}
h1{font-size:28px;line-height:1.2;margin-bottom:14px}p{font-size:19px;line-height:1.45;color:#cfd3da;white-space:pre-line}
#btn{display:flex;gap:14px;margin-top:40px}
button{flex:1;border:0;border-radius:14px;font-size:22px;font-weight:700;padding:24px 0;color:#fff;-webkit-tap-highlight-color:transparent}
#ok{background:#1f9d55}#no{background:#c0392b}button:active{opacity:.7}
#son{display:none;text-align:center;margin-top:36px}#son .i{font-size:96px;line-height:1}#son .y{font-size:30px;font-weight:800;margin-top:14px}#son .a{font-size:16px;color:#8a93a3;margin-top:10px}
</style></head><body>
<div class="k">Onay isteği</div><h1 id="t"></h1><p id="b"></p>
<div id="btn"><button id="ok">Onayla</button><button id="no">Reddet</button></div>
<div id="son"><div class="i" id="si"></div><div class="y" id="sy"></div><div class="a" id="sa"></div></div>
<script>
// Bilgiler linkin # kısmında (sunucuya gitmez): base64url(JSON {s:seq, c:cevap konusu, t:başlık, b:metin})
const $=i=>document.getElementById(i);
let D={};try{let h=location.hash.slice(1).replace(/-/g,'+').replace(/_/g,'/');D=JSON.parse(decodeURIComponent(escape(atob(h))))}catch(e){}
const C='https://ntfy.sh/'+(D.c||''),SEQ=D.s||'';
$('t').textContent=D.t||'Geçersiz link';$('b').textContent=D.b||'';
if(!D.c||!D.s){$('btn').style.display='none'}
function goster(c,not){$('btn').style.display='none';$('son').style.display='block';
 if(c==='BEK'){$('si').textContent='⏳';$('sy').textContent='Gönderiliyor…';$('sa').textContent='';return}
 $('si').textContent=c==='OK'?'✅':'❌';$('sy').textContent=c==='OK'?'Onaylandı':'Reddedildi';$('sa').textContent=not||'Claude cevabını aldı. Bu sayfayı kapatabilirsin.'}
async function gonder(c){goster('BEK');
 try{const r=await fetch(C,{method:'POST',body:c+' '+SEQ});if(!r.ok)throw 0;goster(c)}
 catch(e){$('son').style.display='none';$('btn').style.display='flex';$('b').textContent='Gönderilemedi, tekrar bas.'}}
$('ok').onclick=()=>gonder('OK');$('no').onclick=()=>gonder('NO');
if(D.c&&D.s)(async()=>{try{const x=await (await fetch(C+'/json?poll=1&since=48h')).text();
 for(const l of x.split('\n')){if(!l)continue;try{const j=JSON.parse(l);
  if(j.message==='OK '+SEQ)return goster('OK','Bu iş zaten onaylanmıştı.');
  if(j.message==='NO '+SEQ)return goster('NO','Bu iş zaten reddedilmişti.')}catch(e){}}}catch(e){}})();
</script></body></html>

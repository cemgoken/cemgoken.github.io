<!DOCTYPE html><html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex"><meta name="apple-mobile-web-app-title" content="Onay"><meta name="apple-mobile-web-app-capable" content="yes"><title>Onay</title><style>
*{box-sizing:border-box;margin:0}html,body{height:100%;overflow:hidden}
body{background:#0f1115;color:#f2f2f2;font-family:-apple-system,system-ui,sans-serif;display:flex;flex-direction:column;justify-content:center;padding:24px 20px calc(24px + env(safe-area-inset-bottom))}
.k{font-size:14px;color:#8a93a3;letter-spacing:.04em;text-transform:uppercase;margin-bottom:8px}
h1{font-size:26px;line-height:1.2;margin-bottom:12px}p{font-size:18px;line-height:1.4;color:#cfd3da;white-space:pre-line}
#btn{margin-top:30px}.r{display:flex;gap:12px}
button{flex:1;border:0;border-radius:14px;font-weight:700;color:#fff;-webkit-tap-highlight-color:transparent}
.big{font-size:22px;padding:22px 0}#ok{background:#1f9d55}#no{background:#c0392b}button:active{opacity:.7}
.s{font-size:15px;color:#8a93a3;margin:24px 0 10px}.h button{background:#1d3b2c;color:#7fe0a8;font-size:17px;padding:16px 0;border:1px solid #2c6b49}
#bitir{display:none;background:#c0392b;font-size:20px;padding:20px 0;width:100%;margin-top:22px}
#son{display:none;text-align:center;margin-top:30px}#son .i{font-size:90px;line-height:1}#son .y{font-size:30px;font-weight:800;margin-top:12px}#son .a{font-size:17px;color:#8a93a3;margin-top:10px;line-height:1.4}
</style></head><body>
<div class="k" id="k">Onay isteği</div><h1 id="t"></h1><p id="b"></p>
<div id="btn"><div class="r" id="okno"><button class="big" id="ok">Onayla</button><button class="big" id="no">Reddet</button></div>
<div class="s" id="hs">Onayla ve şu süre boyunca hiç sorma:</div>
<div class="r h"><button data-h="1">1 saat</button><button data-h="2">2 saat</button><button data-h="4">4 saat</button><button data-h="8">8 saat</button></div>
<button id="bitir">İzni şimdi bitir</button></div>
<div id="son"><div class="i" id="si"></div><div class="y" id="sy"></div><div class="a" id="sa"></div></div>
<script>
// Bilgiler linkin # kısmında (sunucuya gitmez): base64url(JSON {s:seq, c:cevap konusu, t:başlık, b:metin}) — m:"durum" ise onay modu sayfası
// Süreli izin: cevap konusuna "IZIN <bitiş unix sn>" yazılır; "IZIN KAPAT" izni bitirir.
const $=i=>document.getElementById(i);
let D={};try{let h=location.hash.slice(1).replace(/-/g,'+').replace(/_/g,'/');D=JSON.parse(decodeURIComponent(escape(atob(h))))}catch(e){}
const C='https://ntfy.sh/'+(D.c||''),SEQ=D.s||'',DUR=D.m==='durum';
const saat=u=>new Date(u*1000).toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'});
const simdi=()=>Math.floor(Date.now()/1000);
async function post(x){const r=await fetch(C,{method:'POST',body:x});if(!r.ok)throw 0}
async function oku(){try{return (await (await fetch(C+'/json?poll=1&since=12h')).text()).split('\n').filter(Boolean).map(l=>{try{return JSON.parse(l)}catch(e){return {}}})}catch(e){return []}}
function izinBitis(L){let iz=0;for(const j of L){const m=/^IZIN (\d+)$/.exec(j.message||'');if(m)iz=+m[1];else if(j.message==='IZIN KAPAT')iz=0}return iz>simdi()?iz:0}
function goster(c,not,baslik){$('btn').style.display='none';$('son').style.display='block';
 if(c==='BEK'){$('si').textContent='⏳';$('sy').textContent='Gönderiliyor…';$('sa').textContent='';return}
 $('si').textContent=c==='NO'?'❌':c==='KAPAT'?'🔒':'✅';$('sy').textContent=baslik||(c==='OK'?'Onaylandı':'Reddedildi');$('sa').textContent=not||'Claude cevabını aldı. Bu sayfayı kapatabilirsin.'}
const izinNot=u=>'Saat '+saat(u)+'’e kadar hiçbir sohbet onay sormayacak. Sonra onay modu kendiliğinden açılır.';
function hata(){$('son').style.display='none';$('btn').style.display='block';$('b').textContent='Gönderilemedi, tekrar bas.'}
async function gonder(c,h){goster('BEK');
 try{let not;if(h){const u=simdi()+h*3600;await post('IZIN '+u);not=izinNot(u)}
  if(DUR){goster('OK',not,'İzin verildi');setTimeout(durum,4000);return}
  await post(c+' '+SEQ);goster(c,not)}catch(e){hata()}}
async function bitir(){goster('BEK');try{await post('IZIN KAPAT');goster('KAPAT','Bundan sonra her ağır iş için yine onay sorulacak.','Onay modu açık');setTimeout(durum,4000)}catch(e){hata()}}
async function durum(){const iz=izinBitis(await oku());$('son').style.display='none';$('btn').style.display='block';
 $('k').textContent='Onay modu';$('okno').style.display='none';
 if(iz){$('t').textContent='🔓 İzin açık — '+saat(iz)+'’e kadar';$('b').textContent='Bu saate kadar sohbetler onay sormadan çalışır.';$('hs').textContent='Süreyi değiştir (şimdiden itibaren):';$('bitir').style.display='block'}
 else{$('t').textContent='🔒 Onay modu açık';$('b').textContent='Ağır işler için her seferinde onay sorulur.';$('hs').textContent='Şu süre boyunca hiç sorma:';$('bitir').style.display='none'}}
$('ok').onclick=()=>gonder('OK');$('no').onclick=()=>gonder('NO');$('bitir').onclick=bitir;
document.querySelectorAll('[data-h]').forEach(b=>b.onclick=()=>gonder('OK',+b.dataset.h));
if(!D.c){$('t').textContent='Geçersiz link';$('btn').style.display='none'}
else if(DUR){durum();setInterval(()=>{if($('son').style.display!=='block')durum()},30000)}
else{$('t').textContent=D.t||'';$('b').textContent=D.b||'';
 (async()=>{for(const j of await oku()){if(j.message==='OK '+SEQ)return goster('OK','Bu iş zaten onaylanmıştı.');if(j.message==='NO '+SEQ)return goster('NO','Bu iş zaten reddedilmişti.')}})()}
</script></body></html>
